<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Financeiro</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section id="auth" class="auth">
  <div class="card auth-card">
    <h1>Meu Financeiro</h1>
    <p>Acesse seus dados no computador e no celular.</p>
    <div class="tabs">
      <button id="tabLogin" class="active">Entrar</button>
      <button id="tabSignup">Criar conta</button>
    </div>
    <form id="authForm">
      <label id="nomeWrap" class="hidden">Nome<input id="nome"></label>
      <label>E-mail<input id="email" type="email" required></label>
      <label>Senha<input id="senha" type="password" minlength="6" required></label>
      <button id="authSubmit" class="primary">Entrar</button>
      <p id="authMsg" class="msg"></p>
    </form>
  </div>
</section>

<div id="app" class="hidden">
<header>
  <button id="homeBtn" class="ghost hidden">← Início</button>
  <div><h1>Meu Financeiro</h1><small id="subtitle">Escolha uma área</small></div>
  <div class="user"><span id="userEmail"></span><button id="logout" class="ghost">Sair</button></div>
</header>

<main>
<section id="home" class="view active">
  <div class="accounts">
    <button data-account="PF" class="account"><b>Pessoa Física</b><strong id="saldoPF">R$ 0,00</strong></button>
    <button data-account="CNPJ" class="account"><b>CNPJ</b><strong id="saldoCNPJ">R$ 0,00</strong></button>
  </div>
</section>

<section id="area" class="view">
  <div class="card saldo">
    <h2 id="accountName"></h2><small>Saldo atual</small>
    <strong id="saldoAtual">R$ 0,00</strong><b id="statusSaldo">ZERADO</b>
  </div>

  <div class="quick">
    <button id="btnEntrada" class="primary">+ Entrada</button>
    <button id="btnGasto">+ Gasto</button>
  </div>

  <div class="card">
    <h2>Dia a dia</h2>
    <div id="movList"></div>
  </div>

  <div class="card">
    <div class="head"><div><h2>Contas</h2><small>Água, luz, internet, empréstimos e outras</small></div><button id="btnConta" class="primary small">+ Adicionar conta</button></div>
    <div class="cols">
      <div><h3>Atrasadas <span id="tAtrasadas">R$ 0,00</span></h3><div id="atrasadas"></div></div>
      <div><h3>A pagar <span id="tPagar">R$ 0,00</span></h3><div id="pagar"></div></div>
      <div><h3>Pagas <span id="tPagas">R$ 0,00</span></h3><div id="pagas"></div></div>
    </div>
  </div>

  <div id="orcWrap" class="card hidden">
    <div class="head"><h2>Orçamentos</h2><button id="btnOrc" class="primary small">+ Criar orçamento</button></div>
    <div id="orcFormWrap" class="hidden">
      <form id="orcForm">
        <label>Cliente<input id="orcCliente" required></label>
        <label>WhatsApp<input id="orcWhatsapp"></label>
        <label>Data<input id="orcData" type="date" required></label>
        <label>Descrição<textarea id="orcDesc"></textarea></label>
        <div id="orcItens"></div>
        <button type="button" id="addItem" class="small">+ Item</button>
        <div class="total">Total <strong id="orcTotal">R$ 0,00</strong></div>
        <button class="primary">Salvar orçamento</button>
      </form>
    </div>
    <div id="orcList"></div>
  </div>
</section>
</main>
</div>

<div id="modal" class="modal hidden">
 <div class="card modal-card">
   <div class="head"><h2 id="modalTitle"></h2><button id="closeModal">×</button></div>
   <form id="modalForm">
     <input id="editId" type="hidden"><input id="mode" type="hidden">
     <label>Descrição<input id="descricao" required></label>
     <label>Valor (R$)<input id="valor" type="number" step="0.01" min="0" required></label>
     <label id="dateLabel">Data<input id="data" type="date" required></label>
     <button class="primary">Salvar</button>
   </form>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
